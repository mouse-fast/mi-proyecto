<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi E-Business - Tienda Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi E-Business</h1>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#productos">Productos</a>
            <a href="#carrito" id="cart-btn">Carrito (0)</a>
        </nav>
    </header>

    <main id="inicio">
        <section class="hero">
            <h2>Bienvenido a nuestra solución digital</h2>
            <p>La mejor experiencia de compra en línea adaptada a tus necesidades.</p>
            <a href="#productos" class="btn">Ver Productos</a>
        </section>

        <section id="productos" class="products-section">
            <h2>Nuestros Productos</h2>
            <div class="product-grid">
                <div class="product-card">
                    <h3>Producto 1</h3>
                    <p>$20.00</p>
                    <button onclick="agregarAlCarrito('Producto 1')">Añadir al carrito</button>
                </div>
                <div class="product-card">
                    <h3>Producto 2</h3>
                    <p>$35.00</p>
                    <button onclick="agregarAlCarrito('Producto 2')">Añadir al carrito</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mi E-Business - Proyecto Integrador</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
